<svg viewBox="0 0 780 520" xmlns="http://www.w3.org/2000/svg" font-family="'Google Sans', 'Noto Sans', Helvetica, Arial, sans-serif">
  <defs>
    <!-- Hatching pattern for text embeddings (blue) -->
    <pattern id="hatch-blue" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#3273dc" stroke-width="1.2"/>
    </pattern>
    <!-- Hatching pattern for speech embeddings (red) -->
    <pattern id="hatch-red" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#e74c3c" stroke-width="1.2"/>
    </pattern>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#e74c3c"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#3273dc"/>
    </marker>
  </defs>

  <!-- ========== MAIN ARCHITECTURE (top) ========== -->

  <!-- Waveform -->
  <path d="M30,155 Q35,140 40,155 Q45,170 50,155 Q52,148 54,155 Q56,162 58,155 Q62,130 66,155 Q70,180 74,155 Q76,148 78,155 Q82,138 86,155 Q90,172 94,155 Q96,150 98,155 Q102,135 106,155 Q110,175 114,155 Q116,150 118,155" 
        fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round"/>
  <text x="74" y="185" text-anchor="middle" font-size="11" fill="#666">waveform</text>

  <!-- Arrow: waveform → Mimi Enc -->
  <line x1="124" y1="155" x2="148" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Mimi Enc box -->
  <rect x="155" y="115" width="55" height="80" rx="4" fill="white" stroke="#555" stroke-width="1.8"/>
  <text x="182" y="148" text-anchor="middle" font-size="11.5" font-weight="600" fill="#444">Mimi</text>
  <text x="182" y="163" text-anchor="middle" font-size="11.5" font-weight="600" fill="#444">Enc</text>

  <!-- Arrow: Mimi Enc → z representations -->
  <line x1="210" y1="155" x2="242" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- z representations (vertical stack, T=7 to show many) -->
  <g>
    <!-- z_1 -->
    <circle cx="262" cy="42" r="9" fill="white" stroke="#777" stroke-width="1.5"/>
    <text x="280" y="46" font-size="12" fill="#555">z₁</text>
    <!-- z_2 -->
    <circle cx="262" cy="72" r="9" fill="white" stroke="#777" stroke-width="1.5"/>
    <text x="280" y="76" font-size="12" fill="#555">z₂</text>
    <!-- z_3 -->
    <circle cx="262" cy="102" r="9" fill="white" stroke="#777" stroke-width="1.5"/>
    <text x="280" y="106" font-size="12" fill="#555">z₃</text>
    <!-- z_4 -->
    <circle cx="262" cy="132" r="9" fill="white" stroke="#777" stroke-width="1.5"/>
    <text x="280" y="136" font-size="12" fill="#555">z₄</text>
    <!-- z_5 -->
    <circle cx="262" cy="162" r="9" fill="white" stroke="#777" stroke-width="1.5"/>
    <text x="280" y="166" font-size="12" fill="#555">z₅</text>
    <!-- dots -->
    <circle cx="262" cy="190" r="1.5" fill="#777"/>
    <circle cx="262" cy="200" r="1.5" fill="#777"/>
    <circle cx="262" cy="210" r="1.5" fill="#777"/>
    <!-- z_T -->
    <circle cx="262" cy="232" r="9" fill="white" stroke="#777" stroke-width="1.5"/>
    <text x="280" y="236" font-size="12" fill="#555">z<tspan font-size="8" dy="3">T</tspan></text>
  </g>

  <!-- Bracket for z's - dashed container -->
  <rect x="244" y="25" width="56" height="225" rx="6" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="272" y="268" text-anchor="middle" font-size="10" fill="#888" font-style="italic">T vectors</text>

  <!-- Arrow: z's → Cross-Attention (Key, Value) -->
  <line x1="300" y1="137" x2="355" y2="137" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="328" y="128" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">Key, Value</text>

  <!-- Cross-Attention block (trapezoid shape - wider on left, narrower on right) -->
  <path d="M362,50 L462,80 L462,200 L362,230 Z" fill="#fdf0ef" stroke="#e74c3c" stroke-width="2" rx="4"/>
  <text x="412" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#e74c3c">Cross-</text>
  <text x="412" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#e74c3c">Attention</text>

  <!-- Arrow: text embeddings → Cross-Attention (Query) -->
  <line x1="412" y1="330" x2="412" y2="238" stroke="#3273dc" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="432" y="290" font-size="9.5" fill="#3273dc" font-style="italic" font-weight="600">Query</text>

  <!-- Text embeddings (t_1, t_2, ..., t_N) at bottom -->
  <g>
    <circle cx="362" cy="350" r="10" fill="url(#hatch-blue)" stroke="#3273dc" stroke-width="1.5"/>
    <text x="362" y="374" text-anchor="middle" font-size="11" fill="#3273dc" font-weight="500">t₁</text>

    <circle cx="396" cy="350" r="10" fill="url(#hatch-blue)" stroke="#3273dc" stroke-width="1.5"/>
    <text x="396" y="374" text-anchor="middle" font-size="11" fill="#3273dc" font-weight="500">t₂</text>

    <!-- dots -->
    <text x="427" y="354" text-anchor="middle" font-size="13" fill="#3273dc">…</text>

    <circle cx="458" cy="350" r="10" fill="url(#hatch-blue)" stroke="#3273dc" stroke-width="1.5"/>
    <text x="458" y="374" text-anchor="middle" font-size="11" fill="#3273dc" font-weight="500">t<tspan font-size="8" dy="2">N</tspan></text>
  </g>
  <text x="412" y="396" text-anchor="middle" font-size="10.5" fill="#3273dc" font-style="italic">text embeddings</text>

  <!-- Arrow: Cross-Attention → s outputs -->
  <line x1="462" y1="140" x2="510" y2="140" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- s representations (output, N vectors) -->
  <g>
    <circle cx="535" cy="78" r="10" fill="url(#hatch-red)" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="555" y="83" font-size="12" fill="#c0392b" font-weight="500">s₁</text>

    <circle cx="535" cy="118" r="10" fill="url(#hatch-red)" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="555" y="123" font-size="12" fill="#c0392b" font-weight="500">s₂</text>

    <!-- dots -->
    <circle cx="535" cy="154" r="1.5" fill="#c0392b"/>
    <circle cx="535" cy="164" r="1.5" fill="#c0392b"/>
    <circle cx="535" cy="174" r="1.5" fill="#c0392b"/>

    <circle cx="535" cy="200" r="10" fill="url(#hatch-red)" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="555" y="205" font-size="12" fill="#c0392b" font-weight="500">s<tspan font-size="8" dy="2">N</tspan></text>
  </g>

  <!-- Bracket for s's -->
  <rect x="517" y="60" width="60" height="162" rx="6" fill="none" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="547" y="240" text-anchor="middle" font-size="10" fill="#c0392b" font-style="italic">N vectors</text>

  <!-- ========== SEPARATOR ========== -->
  <line x1="20" y1="420" x2="760" y2="420" stroke="#ccc" stroke-width="1.2"/>

  <!-- ========== SUMMARY (bottom) ========== -->
  
  <!-- "Encoding (non-streaming)" label -->
  <text x="30" y="455" font-size="13" font-weight="700" fill="#333">Encoding</text>
  <text x="30" y="472" font-size="11" fill="#888" font-style="italic">(non-streaming)</text>

  <!-- Input line -->
  <text x="145" y="455" font-size="12" fill="#555">Input =</text>
  <!-- mini waveform -->
  <path d="M200,452 Q204,442 208,452 Q212,462 216,452 Q218,447 220,452 Q224,440 228,452 Q232,464 236,452 Q238,448 240,452" 
        fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <text x="255" y="455" font-size="12" fill="#555">&amp;</text>
  <text x="275" y="455" font-size="12" fill="#555">Text Transcript</text>

  <!-- Output line -->
  <text x="145" y="495" font-size="12" fill="#555">Output =</text>

  <!-- Interleaved output tokens -->
  <g transform="translate(215, 488)">
    <!-- t1 -->
    <circle cx="0" cy="0" r="8.5" fill="url(#hatch-blue)" stroke="#3273dc" stroke-width="1.3"/>
    <text x="0" y="-14" text-anchor="middle" font-size="9" fill="#3273dc">t₁</text>
    <!-- s1 -->
    <circle cx="26" cy="0" r="8.5" fill="url(#hatch-red)" stroke="#e74c3c" stroke-width="1.3"/>
    <text x="26" y="-14" text-anchor="middle" font-size="9" fill="#c0392b">s₁</text>
    <!-- t2 -->
    <circle cx="56" cy="0" r="8.5" fill="url(#hatch-blue)" stroke="#3273dc" stroke-width="1.3"/>
    <text x="56" y="-14" text-anchor="middle" font-size="9" fill="#3273dc">t₂</text>
    <!-- s2 -->
    <circle cx="82" cy="0" r="8.5" fill="url(#hatch-red)" stroke="#e74c3c" stroke-width="1.3"/>
    <text x="82" y="-14" text-anchor="middle" font-size="9" fill="#c0392b">s₂</text>
    <!-- dots -->
    <text x="112" y="4" font-size="13" fill="#555">…</text>
    <!-- tN -->
    <circle cx="140" cy="0" r="8.5" fill="url(#hatch-blue)" stroke="#3273dc" stroke-width="1.3"/>
    <text x="140" y="-14" text-anchor="middle" font-size="9" fill="#3273dc">t<tspan font-size="7" dy="1.5">N</tspan></text>
    <!-- sN -->
    <circle cx="166" cy="0" r="8.5" fill="url(#hatch-red)" stroke="#e74c3c" stroke-width="1.3"/>
    <text x="166" y="-14" text-anchor="middle" font-size="9" fill="#c0392b">s<tspan font-size="7" dy="1.5">N</tspan></text>
  </g>

  <!-- Legend for output -->
  <text x="420" y="495" font-size="10.5" fill="#555">← text-synchronous speech representation (length 2N)</text>

</svg>
