  <!-- Output text labels -->
  <text x="100" y="138" text-anchor="middle" font-size="16" font-weight="600" fill="#444">Hello</text>
  <text x="210" y="138" text-anchor="middle" font-size="16" font-weight="600" fill="#444">World</text>


  <!-- ==================== RIGHT SIDE: Title + Annotation ==================== -->

  <!-- Title -->
  <text x="460" y="80" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Time-synchronous</text>
  <text x="460" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#222">speech representation</text>
  <text x="460" y="132" text-anchor="middle" font-size="13" fill="#888">(e.g., Mimi, Encodec, DAC, SNAC, etc)</text>

  <!-- Annotation box -->
  <rect x="300" y="310" width="320" height="188" rx="8" fill="none" stroke="#aaa" stroke-width="1.2" stroke-dasharray="7 4"/>

  <!-- "Issues" label -->
  <rect x="312" y="300" width="52" height="20" rx="3" fill="#fff"/>
  <text x="338" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#888" font-style="italic">Issues</text>

  <!-- Point 1 -->
  <text x="320" y="346" font-size="13.5" fill="#444">1) <tspan font-weight="700">time-synchronised</tspan> representation.</text>
  <text x="336" y="368" font-size="13" fill="#666">→ 1 speech vector per <tspan font-weight="600" text-decoration="underline">T milliseconds</tspan></text>
  <text x="336" y="390" font-size="13" fill="#666">→ sequence length ≠ #text tokens</text>

  <!-- Point 2 -->
  <text x="320" y="424" font-size="13.5" fill="#444">2) no direct correspondence between</text>
  <text x="336" y="446" font-size="13" fill="#666">text tokens and speech representations.</text>

  <!-- Connecting dashed line from annotation to vectors -->
  <line x1="268" y1="382" x2="300" y2="382" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>

</svg>
