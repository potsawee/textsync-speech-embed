  <line x1="155" y1="488" x2="155" y2="452" stroke="#444" stroke-width="1.5"/>
  <polygon points="150,454 155,444 160,454" fill="#444"/>

  <!-- Dashed container for representations -->
  <rect x="42" y="320" width="226" height="124" rx="10" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="8 5"/>

  <!-- Time-synchronous vectors: 7 uniform gray bars -->
  <rect x="62" y="342" width="20" height="80" rx="4" fill="#d8d8d8" stroke="#bbb" stroke-width="1"/>
  <rect x="90" y="342" width="20" height="80" rx="4" fill="#d8d8d8" stroke="#bbb" stroke-width="1"/>
  <rect x="118" y="342" width="20" height="80" rx="4" fill="#d8d8d8" stroke="#bbb" stroke-width="1"/>
  <rect x="146" y="342" width="20" height="80" rx="4" fill="#d8d8d8" stroke="#bbb" stroke-width="1"/>
  <rect x="174" y="342" width="20" height="80" rx="4" fill="#d8d8d8" stroke="#bbb" stroke-width="1"/>
