  <!-- Arrow: waveform → encoder -->
  <line x1="155" y1="576" x2="155" y2="540" stroke="#444" stroke-width="1.5"/>
  <polygon points="150,542 155,532 160,542" fill="#444"/>

  <!-- Red arrow: text tokens → encoder (the text conditioning input) -->
  <path d="M262 640 L262 516 L252 516" fill="none" stroke="#e74c3c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="254,510 244,516 254,522" fill="#e74c3c"/>

  <!-- Speech Encoder box -->
  <rect x="60" y="488" width="190" height="44" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="155" y="516" text-anchor="middle" font-size="15" font-weight="500" fill="#333">Speech Encoder</text>

  <!-- Arrow: encoder → representations -->
  <line x1="155" y1="488" x2="155" y2="452" stroke="#444" stroke-width="1.5"/>
  <polygon points="150,454 155,444 160,454" fill="#444"/>

  <!-- Dashed container for representations -->
  <rect x="62" y="320" width="186" height="124" rx="10" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="8 5"/>

  <!-- Text-synchronous vectors: 2 colored bars (orange=Hello, blue=World) -->
  <!-- Hello vector (orange) -->
  <rect x="100" y="338" width="28" height="88" rx="5" fill="#f5a623" opacity="0.85" stroke="#e09515" stroke-width="1"/>

  <!-- World vector (blue) -->
  <rect x="182" y="338" width="28" height="88" rx="5" fill="#3273dc" opacity="0.85" stroke="#2660b8" stroke-width="1"/>

  <!-- Arrow: representations → decoder -->
  <line x1="155" y1="320" x2="155" y2="284" stroke="#444" stroke-width="1.5"/>
  <polygon points="150,286 155,276 160,286" fill="#444"/>

  <!-- Speech Decoder box -->
  <rect x="60" y="232" width="190" height="44" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="155" y="260" text-anchor="middle" font-size="15" font-weight="500" fill="#333">Speech Decoder</text>

  <!-- Arrow: decoder → output waveform -->
  <line x1="155" y1="232" x2="155" y2="196" stroke="#444" stroke-width="1.5"/>
  <polygon points="150,198 155,188 160,198" fill="#444"/>

  <!-- Output waveform (orange = Hello, blue = World) -->
  <g transform="translate(60,148)">
    <!-- "Hello" portion (orange, longer) -->
    <line x1="0" y1="20" x2="4" y2="20" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="8" y1="14" x2="8" y2="26" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="12" y1="8" x2="12" y2="32" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="16" y1="4" x2="16" y2="36" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="20" y1="10" x2="20" y2="30" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="24" y1="6" x2="24" y2="34" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="28" y1="12" x2="28" y2="28" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="32" y1="8" x2="32" y2="32" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="36" y1="14" x2="36" y2="26" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="40" y1="16" x2="40" y2="24" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="44" y1="18" x2="44" y2="22" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="48" y1="12" x2="48" y2="28" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="52" y1="6" x2="52" y2="34" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="56" y1="10" x2="56" y2="30" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="60" y1="4" x2="60" y2="36" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="64" y1="8" x2="64" y2="32" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="68" y1="14" x2="68" y2="26" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="72" y1="6" x2="72" y2="34" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="76" y1="10" x2="76" y2="30" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="80" y1="14" x2="80" y2="26" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="84" y1="17" x2="84" y2="23" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/>
    <!-- silence gap -->
    <!-- "World" portion (blue, shorter) -->
    <line x1="96" y1="18" x2="96" y2="22" stroke="#3273dc" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="100" y1="12" x2="100" y2="28" stroke="#3273dc" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="104" y1="6" x2="104" y2="34" stroke="#3273dc" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="108" y1="3" x2="108" y2="37" stroke="#3273dc" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="112" y1="8" x2="112" y2="32" stroke="#3273dc" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="116" y1="4" x2="116" y2="36" stroke="#3273dc" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="120" y1="10" x2="120" y2="30" stroke="#3273dc" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="124" y1="6" x2="124" y2="34" stroke="#3273dc" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="128" y1="12" x2="128" y2="28" stroke="#3273dc" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="132" y1="8" x2="132" y2="32" stroke="#3273dc" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="136" y1="14" x2="136" y2="26" stroke="#3273dc" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="140" y1="17" x2="140" y2="23" stroke="#3273dc" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="144" y1="19" x2="144" y2="21" stroke="#3273dc" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Output text labels (color-coded) -->
  <text x="100" y="138" text-anchor="middle" font-size="16" font-weight="600" fill="#f5a623">Hello</text>
  <text x="210" y="138" text-anchor="middle" font-size="16" font-weight="600" fill="#3273dc">World</text>


  <!-- ==================== RIGHT SIDE: Title + Annotation ==================== -->

  <!-- Title -->
  <text x="460" y="80" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Text-synchronous</text>
  <text x="460" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#222">speech representation</text>
  <text x="460" y="132" text-anchor="middle" font-size="13" fill="#888">(This investigation)</text>

  <!-- Annotation box -->
  <rect x="300" y="310" width="320" height="188" rx="8" fill="none" stroke="#aaa" stroke-width="1.2" stroke-dasharray="7 4"/>

  <!-- Point 1 -->
  <text x="320" y="346" font-size="13.5" fill="#444">1) <tspan font-weight="700">text-synchronised</tspan> representation.</text>
  <text x="336" y="368" font-size="13" fill="#666">→ 1 <tspan font-weight="600" text-decoration="underline">speech vector</tspan> per N text token</text>

  <!-- Point 2 -->
  <text x="320" y="408" font-size="13.5" fill="#444">2) direct correspondence between</text>
  <text x="336" y="430" font-size="13" fill="#666">i-th representation and i-th text token.</text>

  <!-- Connecting dashed line from annotation to vectors -->
  <line x1="248" y1="382" x2="300" y2="382" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>

</svg>
